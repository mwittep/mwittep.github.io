<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ .Site.Params.Author }}">
    <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.role }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}{{ strings.TrimPrefix "/" .Site.Params.avatar }}">
    <meta name="twitter:card" content="summary">

    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">

    {{ $style := resources.Get "css/portfolio.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            saved || (prefersLight ? "light" : "dark")
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    {{ partial "nav.html" . }}
    <main>{{- block "main" . }}{{- end }}</main>
    {{ partial "footer.html" . }}

    <script>
      // Theme toggle
      document.querySelectorAll("[data-theme-toggle]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var root = document.documentElement;
          var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("theme", next); } catch (e) {}
        });
      });

      // Reveal on scroll
      var revealables = document.querySelectorAll(".reveal");
      if (!window.IntersectionObserver) {
        revealables.forEach(function (el) { el.classList.add("is-visible"); });
      } else {
        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                io.unobserve(entry.target);
              }
            });
          },
          { rootMargin: "0px 0px -8% 0px", threshold: 0.05 }
        );
        revealables.forEach(function (el) { io.observe(el); });
      }
    </script>
  </body>
</html>
