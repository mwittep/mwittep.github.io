{{ define "main" }}
<section class="section">
  <div class="wrap">
    <div class="section__head">
      <h2>{{ .Title }}</h2>
    </div>
    <div class="prose">
      {{ .Content }}
      <ul>
        {{ range .Pages.ByDate.Reverse }}
          <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </div>
  </div>
</section>
{{ end }}
